<svg width="1000" height="280" viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- base -->
  <rect width="1000" height="280" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="280" rx="16" fill="url(#grid)" opacity="0.5"/>
  <rect width="1000" height="280" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="999" height="279" rx="16" fill="none" stroke="#1e293b"/>

  <!-- === left side: identity === -->
  <text x="44" y="88" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">Douaa</text>
  <rect x="46" y="102" width="84" height="4" rx="2" fill="url(#accent)"/>

  <text x="44" y="140" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="17">
    Data Science Engineering · 2nd Year
  </text>
  <text x="44" y="163" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">
    ESPRIT × 3iL Ingénieurs — Double Degree
  </text>

  <text x="44" y="196" fill="#7dd3fc" font-family="Consolas, monospace" font-size="13.5">
    data · machine learning · backend engineering
  </text>

  <!-- tag pills -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#e2e8f0">
    <rect x="44" y="218" width="70" height="26" rx="13" fill="#111827" stroke="#334155"/>
    <text x="79" y="235" text-anchor="middle">Python</text>

    <rect x="122" y="218" width="46" height="26" rx="13" fill="#111827" stroke="#334155"/>
    <text x="145" y="235" text-anchor="middle">SQL</text>

    <rect x="176" y="218" width="88" height="26" rx="13" fill="#111827" stroke="#334155"/>
    <text x="220" y="235" text-anchor="middle">ML / AI</text>

    <rect x="272" y="218" width="86" height="26" rx="13" fill="#111827" stroke="#334155"/>
    <text x="315" y="235" text-anchor="middle">FastAPI</text>

    <rect x="366" y="218" width="94" height="26" rx="13" fill="#111827" stroke="#334155"/>
    <text x="413" y="235" text-anchor="middle">Power BI</text>
  </g>

  <text x="44" y="266" fill="#475569" font-family="Consolas, monospace" font-size="11">@doua158</text>

  <!-- === right side: general data-science pipeline icon cluster === -->
  <g transform="translate(600,0)">

    <!-- 1. database -->
    <g transform="translate(20,150)">
      <ellipse cx="30" cy="8" rx="30" ry="10" fill="#1e293b" stroke="#475569"/>
      <path d="M0,8 L0,42 A30,10 0 0 0 60,42 L60,8" fill="#1e293b" stroke="#475569"/>
      <path d="M0,25 A30,10 0 0 0 60,25" fill="none" stroke="#475569"/>
      <ellipse cx="30" cy="8" rx="30" ry="10" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    </g>

    <!-- connecting line 1 -->
    <line x1="90" y1="170" x2="150" y2="170" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="120" cy="170" r="3" fill="#38bdf8"/>

    <!-- 2. neural net (ML) -->
    <g transform="translate(150,90)">
      <g stroke="#475569" stroke-width="1.2">
        <line x1="0" y1="20" x2="40" y2="0"/>
        <line x1="0" y1="20" x2="40" y2="35"/>
        <line x1="0" y1="20" x2="40" y2="70"/>
        <line x1="0" y1="55" x2="40" y2="0"/>
        <line x1="0" y1="55" x2="40" y2="35"/>
        <line x1="0" y1="55" x2="40" y2="70"/>
        <line x1="0" y1="90" x2="40" y2="35"/>
        <line x1="0" y1="90" x2="40" y2="70"/>
        <line x1="40" y1="0" x2="80" y2="35"/>
        <line x1="40" y1="35" x2="80" y2="35"/>
        <line x1="40" y1="70" x2="80" y2="35"/>
      </g>
      <circle cx="0" cy="20" r="5" fill="#334155"/>
      <circle cx="0" cy="55" r="5" fill="#334155"/>
      <circle cx="0" cy="90" r="5" fill="#334155"/>
      <circle cx="40" cy="0" r="5" fill="#38bdf8"/>
      <circle cx="40" cy="35" r="5" fill="#38bdf8"/>
      <circle cx="40" cy="70" r="5" fill="#38bdf8"/>
      <circle cx="80" cy="35" r="7" fill="#34d399"/>
    </g>

    <!-- connecting line 2 -->
    <line x1="255" y1="125" x2="300" y2="125" stroke="url(#accent)" stroke-width="2"/>
    <circle cx="280" cy="125" r="3" fill="#34d399"/>

    <!-- 3. bar chart (analytics / BI) -->
    <g transform="translate(300,70)">
      <rect x="0" y="70" width="16" height="40" rx="2" fill="url(#bar)" opacity="0.55"/>
      <rect x="24" y="45" width="16" height="65" rx="2" fill="url(#bar)" opacity="0.75"/>
      <rect x="48" y="20" width="16" height="90" rx="2" fill="url(#bar)"/>
      <line x1="-6" y1="112" x2="72" y2="112" stroke="#475569"/>
    </g>

    <!-- floating code brackets (backend/API) -->
    <text x="130" y="220" fill="#7dd3fc" font-family="Consolas, monospace" font-size="26" opacity="0.85">&lt;/&gt;</text>

    <!-- floating label -->
    <rect x="288" y="18" width="86" height="24" rx="12" fill="#0b1220" stroke="#34d399"/>
    <text x="331" y="34" fill="#6ee7b7" font-family="Consolas, monospace" font-size="10.5" text-anchor="middle">insight ready</text>
  </g>
</svg>
